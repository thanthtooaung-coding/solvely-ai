<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD43B">
<title>minionsolve.ai</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='fg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd43b'/%3E%3Cstop offset='1' stop-color='%23f2b705'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23fg)'/%3E%3Crect x='1' y='14' width='30' height='4' rx='1' fill='%231a1a1a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%238c96a3' stroke='%231a1a1a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.7' fill='%236d4c41'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%231a1a1a'/%3E%3Ccircle cx='15' cy='15' r='0.8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR (shared) ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sb-head">
      <a class="brand" href="#/home" aria-label="minionsolve.ai home">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 26 26" width="26" height="26">
            <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd43b"/><stop offset="1" stop-color="#f2b705"/></linearGradient></defs>
            <rect width="26" height="26" rx="7" fill="url(#lg)"/>
            <rect x="1" y="11" width="24" height="4" rx="1" fill="#1a1a1a"/>
            <circle cx="13" cy="13" r="6.5" fill="#8c96a3" stroke="#1a1a1a" stroke-width="1.2"/>
            <circle cx="13" cy="13" r="4.2" fill="#ffffff"/>
            <circle cx="13" cy="13" r="2.2" fill="#6d4c41"/>
            <circle cx="13" cy="13" r="1.1" fill="#1a1a1a"/>
            <circle cx="12.2" cy="12.2" r="0.7" fill="#ffffff"/>
          </svg>
        </span>
        <span class="brand-name">minionsolve.ai</span>
      </a>
      <button class="icon-btn sb-collapse" id="sbCollapse" aria-label="Collapse sidebar" data-icon="panel" data-size="17"></button>
    </div>

    <nav class="sb-nav" aria-label="Main navigation">
      <a href="#/home" class="nav-item" data-route="home"><i data-icon="scan"></i><span data-i18n="nav.home">Home</span></a>
      <a href="#/flashcards/sets" class="nav-item" data-route="flashcards"><i data-icon="cards"></i><span data-i18n="nav.flashcards">My Flashcards</span></a>
    </nav>

    <div class="sb-foot"></div>

    <div class="account">
      <span class="avatar" data-icon="user" data-size="13"></span>
      <button class="lang-btn" id="langBtn" aria-label="Switch language: English / မြန်မာ" title="English / မြန်မာ">EN</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" data-icon="moon" data-size="17"></button>
    </div>
  </aside>
  <div class="sb-overlay" id="sbOverlay"></div>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main">
    <button class="icon-btn mob-menu" id="mobMenu" aria-label="Open menu" data-icon="menu" data-size="20"></button>

    <!-- ---------- HOME ---------- -->
    <section id="view-home" class="view home" hidden>
      <div class="home-top">
        <button class="history-link" id="historyBtn"><i data-icon="history" data-size="16"></i><span data-i18n="history">History</span></button>
      </div>

      <h1 class="home-title" data-i18n="home.title">minionsolve.ai: Your AI Study Companion</h1>

      <div class="solver-panel" id="solverPanel">
        <div class="tool-tabs" role="tablist" aria-label="Tool">
          <button role="tab" class="ttab active" data-tab="whiteboard" aria-selected="true"><span class="new-badge">NEW</span><i data-icon="board" data-size="15"></i><span data-i18n="tab.whiteboard">Whiteboard Tutor</span></button>
          <button role="tab" class="ttab" data-tab="flashcards" aria-selected="false"><i data-icon="cards" data-size="15"></i><span data-i18n="tab.flashcards">Flashcards</span></button>
        </div>
        <div class="input-zone">
          <span class="input-pill" id="inputPill">Whiteboard Tutor</span>
          <textarea id="question" aria-label="Enter a problem" rows="3"></textarea>
          <div class="wb-hint" id="wbHint">
            <span data-i18n="wb.try">Try:</span>
            <button type="button" data-wb="SQL query Big-O complexity analysis">SQL query Big-O complexity</button>
            <button type="button" data-wb="Solve 2x + 10 = 25">Solve 2x + 10 = 25</button>
            <button type="button" data-wb="Photosynthesis">Photosynthesis</button>
          </div>
          <div class="fc-opts" id="fcOpts" hidden>
            <label>Cards
              <select id="fcCount" aria-label="Number of cards">
                <option value="8">8</option>
                <option value="12" selected>12</option>
                <option value="20">20</option>
                <option value="30">30</option>
              </select>
            </label>
            <label>Difficulty
              <select id="fcDiff" aria-label="Difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
              </select>
            </label>
            <label>Style
              <select id="fcStyle" aria-label="Card style">
                <option value="basic" selected>Basic</option>
                <option value="detailed">Detailed</option>
                <option value="exam">Exam</option>
              </select>
            </label>
          </div>
          <div class="file-chips" id="fileChips"></div>
        </div>
        <div class="panel-bottom">
          <div class="pb-left">
            <label class="sq-btn" title="Attach a document">
              <i data-icon="clip" data-size="17"></i>
              <input type="file" id="docInput" class="vh" accept=".pdf,.doc,.docx,.txt,.ppt,.pptx" multiple aria-label="Attach a document">
            </label>
            <label class="sq-btn" title="Upload an image">
              <i data-icon="imgplus" data-size="17"></i>
              <input type="file" id="imgInput" class="vh" accept="image/*" multiple aria-label="Upload an image">
            </label>
          </div>
          <div class="pb-right">
            <button class="solve-btn" id="solveBtn" disabled><span data-i18n="createLesson">Create lesson</span></button>
          </div>
        </div>
      </div>

    </section>

    <!-- ---------- WHITEBOARD TUTOR (internal views of Home) ---------- -->
    <section id="view-prep" class="view prep" hidden></section>
    <section id="view-tutor" class="view tutor" hidden></section>

    <!-- ---------- FLASHCARDS ---------- -->
    <section id="view-fc" class="view fc-view" hidden></section>
  </main>
</div>

<!-- History drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="historyDrawer" aria-label="History" aria-hidden="true">
  <div class="drawer-head"><h2 data-i18n="history">History</h2><button class="icon-btn" id="drawerClose" aria-label="Close history" data-icon="x" data-size="18"></button></div>
  <div class="drawer-body" id="historyList"></div>
</aside>

<!-- Modal -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="app.js"></script>
</body>
</html>
